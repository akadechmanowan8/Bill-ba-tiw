<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140f24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="บิลป้าติ๋ว">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🍶 บิลค่าเหล้า | ร้านป้าติ๋ว</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#1a1030;--bg2:#0c1a2b;--panel:rgba(30,26,52,.78);--surface:rgba(255,255,255,.05);--border:rgba(255,214,130,.16);
  --text:#f7f1e6;--muted:#a79fbb;--gold:#f9c74f;--gold2:#f3722c;--red:#ff8fa3;--green:#5fd39a;--dim:rgba(255,255,255,.14);
  --head:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  --font-th:'Noto Sans Thai','Sarabun',sans-serif;--font-mono:'IBM Plex Mono',ui-monospace,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--bg1:#fff4e0;--bg2:#ffe3ec;--panel:rgba(255,255,255,.88);--surface:rgba(120,70,20,.06);--border:rgba(160,90,20,.2);
  --text:#2b2036;--muted:#6f6480;--gold:#b45309;--gold2:#c2410c;--red:#be123c;--green:#15803d;--dim:rgba(60,30,90,.18);
  --head:linear-gradient(180deg,rgba(255,200,120,.35),rgba(255,255,255,.2));}
}
:root[data-theme="light"]{--bg1:#fff4e0;--bg2:#ffe3ec;--panel:rgba(255,255,255,.88);--surface:rgba(120,70,20,.06);--border:rgba(160,90,20,.2);
  --text:#2b2036;--muted:#6f6480;--gold:#b45309;--gold2:#c2410c;--red:#be123c;--green:#15803d;--dim:rgba(60,30,90,.18);
  --head:linear-gradient(180deg,rgba(255,200,120,.35),rgba(255,255,255,.2));}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(900px 500px at 85% -10%,rgba(249,199,79,.16),transparent 60%),radial-gradient(700px 500px at -10% 20%,rgba(244,114,182,.13),transparent 60%),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;
  color:var(--text);font-family:var(--font-th);font-size:14px;line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.top{padding:20px 0 4px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:grid;place-items:center;font-size:26px;box-shadow:0 6px 20px rgba(243,114,44,.35)}
.top h1{font-size:20px;font-weight:700;line-height:1.25;background:linear-gradient(90deg,var(--gold),#ffd9a0);-webkit-background-clip:text;background-clip:text;color:transparent}
.top p{font-size:11px;color:var(--muted);font-family:var(--font-mono);letter-spacing:.04em}
.badge{margin-left:auto;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2b1400;font-size:12px;font-weight:700;padding:5px 14px;border-radius:99px;font-family:var(--font-mono)}
.btn{padding:9px 16px;border-radius:10px;border:none;cursor:pointer;font-family:var(--font-th);font-size:13px;font-weight:600;transition:.15s}
.btn-primary{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2b1400;box-shadow:0 4px 14px rgba(243,114,44,.35)}
.btn-primary:active{transform:scale(.97)}
.btn-ghost{background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.btn-ghost:hover{color:var(--text)}
.price{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.price span{background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:3px 13px;font-size:12px;color:var(--muted)}
.price b{color:var(--gold);font-family:var(--font-mono);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:13px 15px;position:relative;overflow:hidden;backdrop-filter:blur(8px)}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--gold),var(--gold2))}
.card.big{background:linear-gradient(135deg,rgba(243,114,44,.28),rgba(249,199,79,.16)),var(--panel)}
.lbl{font-size:11px;color:var(--muted)}
.val{font-family:var(--font-mono);font-size:22px;font-weight:600;line-height:1.3}
.val.gold{color:var(--gold)}
.sub{font-size:11px;color:var(--muted);font-family:var(--font-th)}
.form{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:15px;margin-top:14px;backdrop-filter:blur(8px)}
.form h2{font-size:14px;color:var(--gold);margin-bottom:10px;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:3px;flex:1;min-width:120px}
.fld label{font-size:11px;color:var(--muted)}
.fld input,.fld select{background:var(--surface);border:1px solid var(--dim);border-radius:9px;color:var(--text);font-family:var(--font-mono);font-size:14px;padding:9px 11px;outline:none;width:100%;color-scheme:dark light}
.fld select{font-family:var(--font-th)}
.fld input:focus,.fld select:focus{border-color:var(--gold)}
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:10px}
.items .fld input{text-align:center}
.cols{display:flex;gap:12px;overflow-x:auto;padding:14px 0 18px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.col{--pc:#f9c74f;flex:1 0 258px;scroll-snap-align:start;background:var(--panel);border:1px solid var(--border);border-top:4px solid var(--pc);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;backdrop-filter:blur(8px)}
.col-h{background:var(--head);padding:12px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:color-mix(in srgb,var(--pc) 28%,transparent);border:1px solid var(--pc)}
.col-h h3{font-size:16px;font-weight:600;flex:1}
.col-h .t{font-family:var(--font-mono);font-weight:600;color:var(--pc);font-size:17px}
.col-b{flex:1;padding:4px 0;min-height:90px}
.day{padding:10px 14px;border-bottom:1px dashed var(--border)}
.day:last-child{border-bottom:none}
.day-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;gap:6px}
.day-h .d{font-size:13px;font-weight:600;color:var(--pc)}
.day-h .s{display:block;font-size:10px;color:var(--muted);font-weight:400}
.x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 7px;border-radius:6px}
.x:hover{color:var(--red);background:rgba(255,143,163,.12)}
.ln{display:flex;justify-content:space-between;font-size:12px;font-family:var(--font-mono)}
.ln span:first-child{font-family:var(--font-th);color:var(--muted)}
.ln.sum{margin-top:4px;padding-top:4px;border-top:1px solid var(--border);font-weight:600;color:var(--gold)}
.ln.sum span:first-child{color:var(--gold)}
.empty{text-align:center;color:var(--muted);font-size:12px;padding:26px 10px}
.col-f{padding:10px 14px;border-top:1px solid var(--border);background:var(--surface);font-size:11px;color:var(--muted)}
.col-f div{display:flex;justify-content:space-between}
.col-f b{font-family:var(--font-mono);color:var(--text);font-weight:500}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:linear-gradient(135deg,#16a34a,#5fd39a);color:#052e16;font-weight:600;padding:9px 20px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding-bottom:28px;font-size:11px;color:var(--muted)}
@media print{.form,.x,.foot .btn{display:none}.cols{overflow:visible;flex-wrap:wrap}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">🍶</div>
    <div>
      <h1>บิลค่าเหล้า ร้านป้าติ๋ว</h1>
      <p>เหล้าหงส์ทอง · โซดา · แยกตามคน</p>
    </div>
    <span class="badge" id="monthBadge">พ.ย. 2569</span>
  </div>

  <div class="price" id="priceTags"></div>

  <div class="cards">
    <div class="card big"><div class="lbl">ยอดรวมทุกคน (บาท)</div><div class="val gold" id="s-total">0</div><div class="sub" id="s-upd">ยังไม่มีการบันทึก</div></div>
    <div class="card"><div class="lbl">เหล้าทั้งหมด (ขวด)</div><div class="val" id="s-qty">0</div><div class="sub" id="s-detail">—</div></div>
    <div class="card"><div class="lbl">จำนวนวันที่มีบิล</div><div class="val" id="s-days">0</div><div class="sub">วัน</div></div>
  </div>

  <div class="form">
    <h2>＋ เพิ่มรายการ</h2>
    <div class="row">
      <div class="fld"><label>วันที่</label><input type="date" id="f-date"></div>
      <div class="fld"><label>ใคร</label><select id="f-person"></select></div>
    </div>
    <div class="items" id="itemInputs"></div>
    <div class="row" style="margin-top:12px;justify-content:flex-end;align-items:center">
      <button class="btn btn-primary" onclick="addEntry()">💾 บันทึก</button>
    </div>
  </div>

  <div class="cols" id="cols"></div>

  <div class="foot">
    <span id="saveNote">กำลังโหลดข้อมูล…</span>
    <span style="display:flex;gap:8px">
      <button class="btn btn-ghost" onclick="exportData()">⬇ สำรองข้อมูล</button>
      <button class="btn btn-ghost" onclick="document.getElementById('imp').click()">⬆ นำเข้า</button>
      <input type="file" id="imp" accept="application/json,.json" hidden onchange="importData(this)">
      <button class="btn btn-ghost" onclick="window.print()">🖨 พิมพ์</button>
      <button class="btn btn-ghost" onclick="resetAll()">ล้างทั้งหมด</button>
    </span>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const PEOPLE = [
  {n:'พี่ตุ๊ก', c:'#f6ad55', e:'🥃'},
  {n:'พี่เจน',  c:'#f687b3', e:'🍹'},
  {n:'พี่ตาม',  c:'#5fd39a', e:'🍺'},
  {n:'ปอนด์',   c:'#63b3ed', e:'🥂'}
];
const ITEMS = [
  {k:'bearn', name:'หงส์ทอง แบร์น', price:170},
  {k:'liter', name:'หงส์ทอง ลิตร',  price:410},
  {k:'round', name:'หงส์ทอง กลม',   price:300},
  {k:'soda',  name:'โซดา',          price:10}
];
const MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const KEY = 'bill-pa-tiw-v2';

let data = [];       // รายการบิลทั้งหมด (เริ่มว่าง)
let updated = null;  // เวลาที่อัปเดตล่าสุด (ISO)

// 1) โหลดจากเครื่องก่อน เพื่อให้เห็นข้อมูลทันที
try { const r = JSON.parse(localStorage.getItem(KEY) || 'null'); if (r) { data = r.entries || []; updated = r.updated || null; } } catch(e){}
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify({entries:data, updated})); }catch(e){} }

function persist(){
  updated = new Date().toISOString();
  saveLocal();
}

const n = v => Number(v).toLocaleString('en-US');
const total = q => ITEMS.reduce((s,i)=> s + (q[i.k]||0)*i.price, 0);
const dFmt = iso => { const [y,m,d] = iso.split('-').map(Number); return d+' '+MON[m-1]+' '+String(y+543).slice(2); };
function tFmt(iso){
  if(!iso) return '';
  const t = new Date(iso); if(isNaN(t)) return '';
  return t.getDate()+' '+MON[t.getMonth()]+' '+String(t.getFullYear()+543).slice(2)+' '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')+' น.';
}
function setNote(){
  document.getElementById('saveNote').textContent = 'ข้อมูลเก็บในเครื่องนี้ · ควรกด “สำรองข้อมูล” เป็นระยะ';
}

document.getElementById('priceTags').innerHTML = ITEMS.map(i=>`<span>${i.name} <b>${i.price}</b>฿</span>`).join('');
document.getElementById('f-person').innerHTML = PEOPLE.map(p=>`<option>${p.n}</option>`).join('');
document.getElementById('itemInputs').innerHTML = ITEMS.map(i=>
  `<div class="fld"><label>${i.name} (${i.price}฿)</label><input type="number" inputmode="numeric" min="0" value="0" id="q-${i.k}"></div>`).join('');
const now = new Date();
document.getElementById('f-date').value = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
document.getElementById('monthBadge').textContent = MON[now.getMonth()]+' '+(now.getFullYear()+543);

function readQ(){ const q={}; ITEMS.forEach(i=> q[i.k]=Math.max(0,parseInt(document.getElementById('q-'+i.k).value)||0)); return q; }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1900); }

function addEntry(){
  const date = document.getElementById('f-date').value;
  const person = document.getElementById('f-person').value;
  const q = readQ();
  if(!date){ toast('กรุณาเลือกวันที่'); return; }
  if(total(q)===0){ toast('ยังไม่ได้ใส่จำนวน'); return; }
  const stamp = new Date().toISOString();
  const ex = data.find(e=>e.date===date && e.person===person);
  if(ex){ ITEMS.forEach(i=> ex.q[i.k]=(ex.q[i.k]||0)+q[i.k]); ex.saved = stamp; }
  else data.push({id:Date.now(),date,person,q,saved:stamp});
  persist(); ITEMS.forEach(i=>document.getElementById('q-'+i.k).value=0); render();
  toast('✓ บันทึกให้'+person+' แล้ว');
}

function exportData(){
  const blob = new Blob([JSON.stringify({entries:data, updated},null,1)], {type:'application/json'});
  const a = document.createElement('a');
  const d = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = 'bill-pa-tiw-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.json';
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast('⬇ ดาวน์โหลดไฟล์สำรองแล้ว');
}
function importData(inp){
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const j = JSON.parse(r.result);
      if(!Array.isArray(j.entries)) throw 0;
      if(!confirm('นำเข้าข้อมูลนี้? ข้อมูลปัจจุบันจะถูกแทนที่')) return;
      data = j.entries; persist(); render(); toast('✓ นำเข้าข้อมูลแล้ว');
    }catch(e){ toast('ไฟล์ไม่ถูกต้อง'); }
    inp.value='';
  };
  r.readAsText(f);
}
function del(id){ if(!confirm('ลบรายการนี้?')) return; data = data.filter(e=>e.id!==id); persist(); render(); }
function resetAll(){ if(!confirm('ล้างข้อมูลทั้งหมดใช่ไหม? กู้คืนไม่ได้')) return; data=[]; persist(); render(); }

function render(){
  let grand=0, tq={bearn:0,liter:0,round:0,soda:0}, days=new Set();
  document.getElementById('cols').innerHTML = PEOPLE.map(p=>{
    const es = data.filter(e=>e.person===p.n).sort((a,b)=>a.date<b.date?-1:1);
    let pt=0, pq={bearn:0,liter:0,round:0,soda:0};
    const body = es.length ? es.map(e=>{
      const sub = total(e.q); pt+=sub; days.add(e.date);
      ITEMS.forEach(i=>{ pq[i.k]+=e.q[i.k]||0; tq[i.k]+=e.q[i.k]||0; });
      const lines = ITEMS.filter(i=>e.q[i.k]>0).map(i=>
        `<div class="ln"><span>${i.name} ${e.q[i.k]} × ${i.price}</span><span>${n(e.q[i.k]*i.price)}</span></div>`).join('');
      const st = e.saved ? `<span class="s">บันทึก ${tFmt(e.saved)}</span>` : '';
      return `<div class="day"><div class="day-h"><span class="d">📅 ${dFmt(e.date)}${st}</span><button class="x" onclick="del(${e.id})" aria-label="ลบ">✕</button></div>${lines}<div class="ln sum"><span>รวมวันนี้</span><span>${n(sub)}</span></div></div>`;
    }).join('') : '<div class="empty">ยังไม่มีรายการ</div>';
    grand+=pt;
    const foot = ITEMS.map(i=>`<div><span>${i.name}</span><b>${pq[i.k]}</b></div>`).join('');
    return `<section class="col" style="--pc:${p.c}"><div class="col-h"><span class="av">${p.e}</span><h3>${p.n}</h3><span class="t">${n(pt)} ฿</span></div><div class="col-b">${body}</div><div class="col-f">${foot}</div></section>`;
  }).join('');
  document.getElementById('s-total').textContent = n(grand);
  document.getElementById('s-qty').textContent = tq.bearn+tq.liter+tq.round;
  document.getElementById('s-detail').textContent = `แบร์น ${tq.bearn} · ลิตร ${tq.liter} · กลม ${tq.round} · โซดา ${tq.soda}`;
  document.getElementById('s-days').textContent = days.size;
  document.getElementById('s-upd').textContent = updated ? 'อัปเดตล่าสุด '+tFmt(updated) : 'ยังไม่มีการบันทึก';
}
render(); setNote();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
</body>
</html>
